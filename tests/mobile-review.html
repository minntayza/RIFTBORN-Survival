<!doctype html><meta charset="utf-8"><title>Mobile review</title><style>body{background:#17262c;color:#fff;font:14px system-ui}iframe{display:block;border:1px solid #788}button,select{padding:8px;margin:6px}</style><label>Phone size <select id="size"><option>390x844</option><option>932x430</option><option>320x568</option><option>844x390</option><option>667x375</option></select></label><label>Screen <select id="screen"><option value="../">Main game</option><option value="mobile-live-review.html?mode=daily">Daily combat</option><option value="card-design-preview.html">Upgrade cards</option></select></label><iframe title="Mobile review screen" width="390" height="844" src="../"></iframe><script>const f=document.querySelector('iframe');document.querySelector('#size').onchange=e=>{const [w,h]=e.target.value.split('x');f.width=w;f.height=h};document.querySelector('#screen').onchange=e=>f.src=e.target.value;</script>
