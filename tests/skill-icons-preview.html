<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Approved skill icons</title><style>body{margin:0;padding:24px;background:#10252c;color:#f3dfae;font:14px system-ui}h1{font-size:24px}main{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;max-width:680px}article{text-align:center;background:#15232a;border:1px solid #78653d;border-radius:12px;padding:12px}svg{width:76px;height:76px;display:block;margin:0 auto 8px}b{display:block;font-size:12px}h2{font-size:18px}</style></head><body><h1>Simplified ability icons · In-game assets</h1><main id="icons"></main><h2>Gunner cosmetic gadgets</h2><main id="gunner-themes"></main><h2>Tank cosmetic variants</h2><main id="themes"></main><script type="module">
import {skillIcon} from '/src/skill-icons.ts';
const rows=[['dash','Shadow Dash'],['counter','Perfect Counter'],['draw','Flash Draw'],['mark','Blade Tempest'],['overdrive','Overdrive'],['beacon','Ricochet Beacon'],['breach','Breach Charge'],['slam','Ground Slam'],['bulwark','Magnetic Bulwark'],['march','Wrecking March'],['datlone','Dat Lone'],['flame','Flame Step'],['staffslam','Staff Slam']];document.querySelector('#icons').innerHTML=rows.map(([id,name])=>`<article>${skillIcon(id)}<b>${name}</b></article>`).join('');document.querySelector('#themes').innerHTML=[['sakura','Royal Bulwark'],['jade','Forge Warden'],['starlight','Polar Bastion']].map(([id,name])=>`<article>${skillIcon('slam','tank',id)}<b>${name}</b></article>`).join('');
document.querySelector('#gunner-themes').innerHTML=[['sakura','Lucky Outlaw'],['jade','Street Ace'],['starlight','Star Courier']].flatMap(([theme,name])=>['breach','beacon','overdrive'].map(id=>`<article>${skillIcon(id,'gunner',theme)}<b>${name} · ${id}</b></article>`)).join('');
</script></body></html>
