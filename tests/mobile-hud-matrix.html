<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Mobile HUD layout matrix</title><style>body{background:#10232b;color:#eddec1;font:14px system-ui}iframe{border:1px solid #8eab9c;display:block}article{margin-bottom:24px}output{white-space:pre-wrap}</style></head><body><h1>Mobile HUD · 32 layout checks</h1><output id="report">Running phone layouts…</output><div id="frames"></div><script>
const sizes=[[320,568],[390,844],[667,375],[844,390]],cases=['samurai','ninja'].flatMap(hero=>['left','right'].flatMap(side=>[1,2].map(map=>({hero,side,map}))));let passes=0,done=0;const frames=sizes.map(([w,h],i)=>{const article=document.createElement('article');article.innerHTML=`<h2>${w} × ${h}</h2><iframe title="Phone ${w} × ${h}" width="${w}" height="${h}"></iframe>`;document.querySelector('#frames').append(article);return article.querySelector('iframe')});function run(i,n){const c=cases[n];frames[i].src=`./mobile-hud-preview.html?hero=${c.hero}&side=${c.side}&map=${c.map}&case=${i}-${n}`;}window.addEventListener('message',e=>{if(e.origin!==location.origin||!e.data.case)return;const [i,n]=e.data.case.split('-').map(Number);done++;if(e.data.mobileHud)passes++;document.querySelector('#report').textContent+=`\n${e.data.mobileHud?'PASS':'FAIL'} ${e.data.size.join('×')} ${cases[n].hero} ${cases[n].side} ${cases[n].map}× · ${Math.round(e.data.diameter)}px`;if(n<cases.length-1)run(i,n+1);if(done===32)document.querySelector('#report').textContent+=`\nFINISHED: ${passes}/32 passed`;});frames.forEach((_,i)=>run(i,0));
</script></body></html>
