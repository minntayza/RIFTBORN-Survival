<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Camp UI · isolated test</title></head><body><div id="game"></div><div id="hud"></div><div id="overlay"></div><script type="module">

</script></body></html>
